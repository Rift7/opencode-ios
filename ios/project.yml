name: OpenCode
options:
  bundleIdPrefix: ai.opencode.migration
  deploymentTarget:
    iOS: "27.2"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.48.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "27.2"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  OpenCodeKit:
    path: OpenCodeKit
  ComposableArchitecture:
    url: https://github.com/pointfreeco/swift-composable-architecture
    exactVersion: 1.26.2

targets:
  OpenCode:
    type: application
    platform: iOS
    sources:
      - path: OpenCode
        excludes:
          - "**/.gitkeep"
    dependencies:
      - package: OpenCodeKit
        product: OpenCodeCore
      - package: OpenCodeKit
        product: OpenCodeServer
      - package: OpenCodeKit
        product: OpenCodeApp
      - package: OpenCodeKit
        product: OpenCodeDrawer
      - package: OpenCodeKit
        product: OpenCodeTranscript
      - package: OpenCodeKit
        product: OpenCodeMedia
      - package: OpenCodeKit
        product: OpenCodeComposer
      - package: OpenCodeKit
        product: OpenCodeSettings
      - package: ComposableArchitecture
        product: ComposableArchitecture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.opencode.migration
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: OpenCode/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor

  OpenCodeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OpenCodeTests
    dependencies:
      - package: OpenCodeKit
        product: OpenCodeCore
      - package: OpenCodeKit
        product: OpenCodeServer
      - package: OpenCodeKit
        product: OpenCodeTestSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.opencode.migration.tests
        GENERATE_INFOPLIST_FILE: YES

  OpenCodeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: OpenCodeUITests
    dependencies:
      - target: OpenCode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.opencode.migration.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  OpenCode:
    build:
      targets:
        OpenCode: all
        OpenCodeTests: [test]
        OpenCodeUITests: [test]
    test:
      targets:
        - OpenCodeTests
        - OpenCodeUITests
    run:
      config: Debug
